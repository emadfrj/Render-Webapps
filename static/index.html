<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>Daymark — a little more focused</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Daymark home"><span class="brand-mark">d</span> daymark</a>
      <span class="date-label" id="today"></span>
    </header>

    <section class="intro" aria-labelledby="greeting">
      <p class="eyebrow">YOUR DAILY SPACE</p>
      <h1 id="greeting">A little more <span>focused.</span></h1>
      <p class="subtitle">Make room for what matters today.</p>
    </section>

    <section class="task-card" aria-labelledby="tasks-heading">
      <div class="card-heading">
        <div><p class="eyebrow">THE LIST</p><h2 id="tasks-heading">Today’s tasks</h2></div>
        <span class="task-count" id="task-count">0 left</span>
      </div>
      <form id="task-form" class="add-form">
        <label class="sr-only" for="task-input">New task</label>
        <input id="task-input" name="title" type="text" placeholder="What would you like to do?" maxlength="120" autocomplete="off" required>
        <button type="submit" aria-label="Add task">+</button>
      </form>
      <p class="form-error" id="form-error" role="alert"></p>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <div class="empty-state" id="empty-state" hidden><span class="empty-icon">✦</span><p>You’re all caught up.</p><small>Enjoy the space you made.</small></div>
      <footer class="card-footer"><span class="status-dot"></span> Small steps still move you forward.</footer>
    </section>
    <p class="page-note">One thing at a time is a good pace.</p>
  </main>
</body>
</html>
